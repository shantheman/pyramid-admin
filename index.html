<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Pyramid Admin</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><img src="favicon.png" alt=""><div><strong>Pyramid</strong><span>Admin · Sand to Stars</span></div></div><button id="logout" hidden>Sign out</button></header>
<main><section id="login" class="login"><h1>Pyramid Admin</h1><p>Store revenue, advertising and player activity in one place.</p><button id="google">Continue with Google</button></section><p id="status" role="status"></p>
<nav id="nav" aria-label="Core metrics" hidden><button data-tab="metrics" aria-label="Top Metrics" title="Top Metrics">📊 <span>Top Metrics</span></button><button data-tab="ads" aria-label="Ad Spend" title="Ad Spend">📣 <span>Ad Spend</span></button><button data-tab="pnl" aria-label="P&amp;L" title="P&amp;L">🧾 <span>P&amp;L</span></button><button data-tab="reviews" aria-label="Reviews" title="Reviews">⭐ <span>Reviews</span></button></nav>
<section id="content" hidden><h1 id="page-title"></h1><div class="toolbar"><label>Period <select id="period"><option value="30d">Last 30 days</option><option value="7d">Last 7 days</option><option value="yesterday">Yesterday</option><option value="today">Today</option><option value="all">All time</option><option value="custom">Custom</option></select></label><label>From <input id="from" type="date"></label><label>Through <input id="through" type="date"></label><button id="updates">Check for updates</button></div><p id="updated" class="muted"></p><div id="view"></div><details id="sources"><summary>Sources &amp; reporting status</summary><div id="source-list"></div></details></section>
</main><script src="vendor-supabase.js"></script><script type="module" src="app.js"></script></body></html>
